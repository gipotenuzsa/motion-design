<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motion Engine</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script src="post.js"></script>
<script>
  // Preview mode: open in a browser to play in real time (?f=123 renders a single frame).
  window.ready = (async () => {
    await Promise.all(['900 100px Inter', '800 100px Inter', '600 100px Inter', '500 100px Inter',
      'bold 100px "DejaVu Sans Mono"', '500 100px "DejaVu Sans Mono"'].map(f => document.fonts.load(f)));
    return true;
  })();
  const q = new URLSearchParams(location.search);
  if (q.has('preview')) window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { const f = Math.floor((performance.now() - t0) / 1000 * FPS) % FRAMES; renderFrame(f); requestAnimationFrame(loop); };
    loop();
  });
</script>
</body>
</html>
